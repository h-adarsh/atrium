version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: atrium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
    # SECURITY: PostgreSQL is NOT exposed to the host/internet (no published ports).
    # It communicates only within the internal bridge network.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atrium_user} -d ${POSTGRES_DB:-atrium}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atrium-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atrium-portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound strictly to localhost by default so public traffic must go through reverse proxy (Nginx / Caddy).
      # Set APP_PORT_BINDING=0.0.0.0:5001 in .env if testing direct container access.
      - "${APP_PORT_BINDING:-127.0.0.1:5001}:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-atrium_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atrium}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Set strong JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      ENABLE_DEMO_ACCOUNTS: ${ENABLE_DEMO_ACCOUNTS:-false}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    volumes:
      - app_uploads:/app/server/uploads
    networks:
      - atrium-internal

networks:
  atrium-internal:
    driver: bridge

volumes:
  postgres_data:
  app_uploads:
